# Copy to /etc/conf.d/archriscv-buildd and adjust if needed.
# The systemd unit runs as root so build commands use root's normal configuration.
# Install only the archriscv-buildd executable; its Ruby and JavaScript code is
# self-contained. xterm and its fit addon load directly from jsDelivr with pinned
# versions and integrity checks; no Node.js/npm installation is needed by buildd.
# The browser replays recorded output and resizes in batches over one streamed
# request, then shows the latest screen with scrollback. Large recordings take
# longer to download on attachment; no server-side terminal emulator is used.
# Interactive Codex uses `codex` on PATH and the service user's existing Codex
# login, configuration and rv skill (requires --no-daemon support).
# Each terminal has its own systemd service and survives browser disconnects
# and scheduler restarts. Only editors can
# access terminal output or input; no additional listener/proxy port is needed.
# Spawn Codex is available on the latest failed build for each package. Exiting
# Codex queues one retry with SWITCHBRANCH=1 unless Skip rebuild on exit is set.
# The terminal page can also change that choice or stop without rebuilding.
# Working/waiting labels use Codex's terminal-title activity indicator. New
# sessions explicitly enable the spinner/project title; quiet output alone does
# not count as waiting. Live terminal pages return to the dashboard on exit;
# opening an already-ended session keeps its history visible.
# Codex starts in ~/projects/archriscv/packages; the rv skill manages its worktree
# and commits. Rebuilds use committed overlay contents, as normal riscvu does.

# One public, read-only dashboard; GitHub-approved editors get build controls.
# Terminate HTTPS at a trusted reverse proxy and forward to this listener.
ARCHRISCV_BUILDD_BIND=127.0.0.1
ARCHRISCV_BUILDD_PORT=9181

# Register a GitHub OAuth app or GitHub App with callback URL:
# https://example.com/buildd/auth/github/callback
# Set all three to enable login. Without credentials the dashboard stays read-only.
# The public URL may include a path prefix; the proxy must strip it when forwarding.
# Use HTTPS; HTTP is allowed only on localhost. GitHub App private keys are not used.
# Keep this installed config root-owned, mode 0600: it contains the client secret.
# ARCHRISCV_BUILDD_PUBLIC_URL=https://example.com/buildd/
# ARCHRISCV_BUILDD_GITHUB_CLIENT_ID=
# ARCHRISCV_BUILDD_GITHUB_CLIENT_SECRET=
# Comma-separated GitHub usernames, matched case-insensitively. Empty means no editors.
# ARCHRISCV_BUILDD_GITHUB_EDITORS=alice,bob
# Login requests no GitHub scopes. Browser sessions expire after 7 days or daemon restart.
# All edits require the session cookie and a form _csrf or X-CSRF-Token value.
# For riscvu-buildd, set ARCHRISCV_BUILDD_URL to the public URL and run --login.
# Generate a one-use code from Terminal login in the signed-in dashboard.
# Codes expire in 10 minutes; terminal sessions last 30 days or until daemon restart.
# The client saves credentials under ~/.local/state/riscvu-buildd/ with mode 0600.

# Build state and captured logs.
ARCHRISCV_BUILDD_STATE_DIR=/var/lib/archriscv-buildd
ARCHRISCV_BUILDD_LOG_DIR=/var/lib/archriscv-buildd/logs

# Command used by the web scheduler.
# Each build runs in an independent systemd service and survives scheduler restarts.
ARCHRISCV_BUILDD_BUILD_COMMAND=riscvu
ARCHRISCV_BUILDD_REFRESH_COMMAND=archrv-refresh

# Optional:
# Builder hover tags are read from felixbuild-server-select found on PATH.
# ARCHRISCV_BUILDD_SELECTOR_PATH=/usr/local/bin/felixbuild-server-select
# ARCHRISCV_BUILDD_WORKDIR=/var/lib/archriscv-buildd
# Username for bare builder hosts; leave unset to use SSH configuration.
# ARCHRISCV_BUILDD_BUILDER_USER=builder
# Directory used by the server selector; New builder clears only <pkgbase>-riscv64.
# ARCHRISCV_BUILDD_BUILDER_CACHE_DIR=/tmp/felixbuild-server-select
