<html>
  <head>
    <script src="archriscv-log.js?v=1"></script>
  </head>
  <body>
    <pre id="terminal"></pre>
    <script>
      const terminal = new TerminalLog(document.getElementById('terminal'));
      const url = new URLSearchParams(window.location.search).get('url');
      if (url) {
        fetch(url + '?raw').then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        }).then(text => terminal.write(text)).catch(error => {
          document.getElementById('terminal').textContent = `Could not load log: ${error.message}`;
        });
      }
    </script>
  </body>
</html>
